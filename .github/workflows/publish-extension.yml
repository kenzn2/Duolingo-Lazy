name: Publish Chrome Extension

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.3.2, v2.0.0

permissions:
  contents: write  # Required for creating releases

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Update manifest version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.json
          echo "Updated manifest.json to version $VERSION"
      
      - name: Create ZIP package
        run: |
          mkdir -p dist
          zip -r dist/duolingo-lazy-${{ steps.get_version.outputs.VERSION }}.zip \
            manifest.json \
            src/ \
            -x "*.git*" \
            -x "*node_modules*" \
            -x "*.github*" \
            -x "*dist*"
      
      # Chrome Web Store upload được comment - upload thủ công file ZIP từ GitHub Release
      # Nếu muốn auto-upload, cần setup 3 secrets: CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN
      # Xem hướng dẫn tại: CI_CD_SETUP.md
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/duolingo-lazy-${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## 🎉 Release v${{ steps.get_version.outputs.VERSION }}
            
            ### 📦 Cài đặt
            1. Tải file ZIP bên dưới
            2. Upload thủ công lên [Chrome Web Store Developer Dashboard](https://chrome.google.com/webstore/devconsole)
            
            ### 🔧 Auto-upload (tùy chọn)
            Nếu muốn tự động upload, xem hướng dẫn setup tại `CI_CD_SETUP.md`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Extension v${{ steps.get_version.outputs.VERSION }} đã được publish thành công!"
          echo "🔗 Chrome Web Store: https://chromewebstore.google.com/detail/duolingo-lazy/omooaaecencefjcahmekmohhpbcmjldi"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Publish thất bại! Vui lòng kiểm tra logs."
